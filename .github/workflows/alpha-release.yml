name: Alpha Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compute alpha version
        id: version
        run: |
          BASE=$(grep -oP '(?<=val versionName = ")[^"]+' build-logic/convention/src/main/kotlin/LjApplicationConventionPlugin.kt)
          ALPHA_VERSION="${BASE}-alpha.${{ github.run_number }}"
          echo "alpha_version=${ALPHA_VERSION}" >> "$GITHUB_OUTPUT"
          sed -i "s/val versionName = \"${BASE}\"/val versionName = \"${ALPHA_VERSION}\"/" \
            build-logic/convention/src/main/kotlin/LjApplicationConventionPlugin.kt

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: make build

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk locationjoystick-v${{ steps.version.outputs.alpha_version }}.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.alpha_version }}
          name: v${{ steps.version.outputs.alpha_version }}
          prerelease: true
          files: locationjoystick-v${{ steps.version.outputs.alpha_version }}.apk
