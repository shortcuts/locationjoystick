name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - '**/*.kt'
              - '**/*.gradle*'
              - '**/gradle-wrapper.properties'
              - '**/AndroidManifest.xml'
              - 'Makefile'
              - 'CHANGELOG.md'
              - '.release-please-manifest.json'
              - '**/*.xml'
              - '**/*.pro'
              - 'docs/wiki/changelog/**'
              - 'docs/wiki/hot/**'

  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: [release-please, filter]
    if: ${{ !cancelled() && needs.filter.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint
        run: make lint

      - name: Run Unit Tests
        run: make test

      - name: Guard tagged changelog JSON
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0)
          FILE="docs/wiki/changelog/${PREV_TAG#v}.json"
          if ! git diff --quiet "$PREV_TAG" HEAD -- "$FILE"; then
            echo "::error::$FILE changed after tag $PREV_TAG. Tagged changelog JSON is final (see docs/features/whats-new.md)."
            exit 1
          fi

      - name: Verify What's New changelog exists for the release PR
        if: ${{ startsWith(github.head_ref, 'release-please--') }}
        run: |
          VERSION=$(jq -r '."."' .release-please-manifest.json)
          FILE="docs/wiki/changelog/${VERSION}.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::Missing $FILE — add it to this release PR (see docs/features/whats-new.md)."
            exit 1
          fi

      - name: Decode keystore
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Build Release APK
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: make build

      - name: Rename APK
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        run: |
          TAG=${{ needs.release-please.outputs.tag_name }}
          mv app/build/outputs/apk/release/app-release.apk locationjoystick-${TAG}.apk

      - name: Upload APK to GitHub Release
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            locationjoystick-${{ needs.release-please.outputs.tag_name }}.apk
