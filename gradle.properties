org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
# AGP 9 defaults this to true, dropping testReleaseUnitTest — `make test` (and CI) target
# the release variant specifically since it's what R8/shrinking actually ships.
android.onlyEnableUnitTestForTheTestedBuildType=false

kotlin.code.style=official
